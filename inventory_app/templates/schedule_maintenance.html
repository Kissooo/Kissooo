{% extends 'base.html' %}

{% block content %}
    <h1 class="mt-4">Schedule Maintenance for {{ item.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Schedule</button>
        <a href="{% url 'item_detail' item.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
