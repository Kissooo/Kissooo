{% extends 'base.html' %}

{% block content %}
    <h1 class="mt-4">Adjust Stock for {{ item.name }}</h1>
    <p>Current calculated quantity: {{ item.quantity }}</p>
    <form method="post">
        {% csrf_token %}
        <p>Enter the change in quantity (e.g., 5 to add, -2 to remove).</p>
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Adjustment</button>
        <a href="{% url 'item_detail' item.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
