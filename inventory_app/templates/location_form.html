{% extends 'base.html' %}

{% block content %}
    <h1 class="mt-4">{% if form.instance.pk %}Edit Location{% else %}Add New Location{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'location_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
