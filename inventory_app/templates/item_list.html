{% extends 'base.html' %}

{% block content %}
    <h1 class="mt-4">Inventory Items</h1>

    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="{% url 'item_list' %}" class="form-inline">
                <div class="input-group">
                    <input type="text" name="q" class="form-control" placeholder="Search by code or name..." value="{{ query|default:'' }}">
                    <div class="input-group-append">
                        <button type="submit" class="btn btn-secondary">Search</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-md-6 text-md-end">
            <a href="{% url 'item_create' %}" class="btn btn-primary">Add New Item</a>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
                <tr>
                    <td>{{ item.code }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>
                        <a href="{% url 'item_update' item.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <form action="{% url 'item_delete' item.pk %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
